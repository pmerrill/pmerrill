<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}{{ site.title }} — {{ site.tagline }}{% elsif page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title | default: site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
{% if site.logo %}<meta property="og:image" content="{{ site.logo }}">
<link rel="icon" href="{{ site.logo }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>
<div class="page">

  <header class="site-header">
    <p class="wordmark"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></p>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer>
    <div class="follow">
      <span class="follow__label">Follow</span>
      <a href="https://x.com/petermerrillse">X</a>
      <a href="https://www.linkedin.com/in/petermerrill">LinkedIn</a>
      <a href="https://github.com/pmerrill">GitHub</a>
      <a href="https://www.threads.net/@petermerrillse">Threads</a>
      <a href="https://roughwork.dev/feed.xml">RSS</a>
      <a href="mailto:peter@petemerrill.com">Email</a>
    </div>
  </footer>

</div>
</body>
</html>
